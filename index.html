<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon Battle — Kanto</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#edf4ff;background:#101827}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1100px;margin:auto}h1{margin:0 0 8px;color:#ffdb4a;text-shadow:2px 2px #344ba0}h2{margin:0 0 12px}.muted{color:#a8b8cf}.panel{background:#1b2940;border:1px solid #354963;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 8px 24px #0003}.hidden{display:none!important}button,select,input{font:inherit}button{background:#385b9e;color:white;border:1px solid #688bce;border-radius:10px;padding:11px 15px;cursor:pointer}button:hover:not(:disabled){filter:brightness(1.22)}button:disabled{opacity:.42;cursor:not-allowed}.primary{background:#ca354d;border-color:#f07b8d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.arena{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fighter{background:linear-gradient(145deg,#273b5c,#18253c);border-radius:16px;padding:18px;min-height:220px}.sprite{height:150px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 10px 7px #0006)}.sprite img{width:144px;height:144px;object-fit:contain;image-rendering:pixelated}.dex-sprite{width:38px;height:38px;object-fit:contain;image-rendering:pixelated;vertical-align:middle;margin-right:8px}.sprite-fallback{font-size:65px}.hp{height:18px;background:#0c1423;border-radius:20px;overflow:hidden;border:1px solid #566b85}.fill{height:100%;background:#43c879;transition:width .35s}.status{display:flex;justify-content:space-between;gap:8px;margin:8px 0}.team{font-size:13px;color:#b8c6db;margin-top:12px}.tag{display:inline-block;background:#3d5173;border-radius:20px;padding:3px 9px;font-size:12px}.log{height:180px;overflow:auto;background:#0e1727;border-radius:10px;padding:12px;line-height:1.6}.log p{margin:0 0 6px;border-bottom:1px solid #24354b;padding-bottom:4px}.selected{outline:3px solid #ffdb4a}input,select{background:#0f1a2c;color:#fff;border:1px solid #4d6487;border-radius:8px;padding:10px;max-width:100%}.pokemon-list{max-height:290px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:12px}.pokemon-list button{text-align:left}.tiny{font-size:12px}.pill{display:inline-block;background:#2b4267;border-radius:16px;padding:5px 9px;margin:3px}#message{font-weight:700;color:#ffdb4a} @media(max-width:650px){body{padding:10px}.arena{grid-template-columns:1fr}.sprite{height:125px}.sprite img{width:120px;height:120px}.fighter{min-height:175px}}
</style></head><body><main>
<h1>⚡ POKÉMON BATTLE</h1><div class="muted">Kanto • Batalha por turnos • HTML, CSS e JavaScript</div>
<section id="setup" class="panel"><h2>Configurar batalha</h2><div class="row"><label>Modo <select id="mode"><option value="ai">Jogador vs IA</option><option value="pvp">Jogador vs Jogador (mesmo computador)</option></select></label><label>Pokémon por equipe <select id="size"><option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option></select></label></div><p id="draft-info"></p><div class="row"><input id="search" placeholder="Buscar Pokémon por nome ou número..."><button id="random-team">Escolher equipe aleatória</button><button id="clear-team">Limpar equipe</button></div><div id="chosen" class="row" style="margin-top:12px"></div><div id="dex" class="pokemon-list"></div><div class="row" style="margin-top:15px"><button id="next" class="primary" disabled>Continuar</button></div></section>
<section id="game" class="hidden"><div class="arena"><article class="fighter"><div class="status"><strong id="name1"></strong><span id="type1" class="tag"></span></div><div class="sprite" id="sprite1">⚡</div><div class="hp"><div class="fill" id="bar1"></div></div><div class="status"><span id="hp1"></span><span id="state1"></span></div><div class="team" id="team1"></div></article><article class="fighter"><div class="status"><strong id="name2"></strong><span id="type2" class="tag"></span></div><div class="sprite" id="sprite2">🔥</div><div class="hp"><div class="fill" id="bar2"></div></div><div class="status"><span id="hp2"></span><span id="state2"></span></div><div class="team" id="team2"></div></article></div><div class="panel"><div class="row space"><h2 id="turn-title">Sua vez</h2><span id="message"></span></div><div id="actions" class="grid"></div><div id="subactions" class="grid" style="margin-top:12px"></div></div><div class="panel"><h2>Registro da batalha</h2><div id="log" class="log" aria-live="polite"></div></div></section>
<section id="finish" class="panel hidden"><h2 id="winner"></h2><p id="result"></p><button onclick="location.reload()" class="primary">Jogar novamente</button></section>
</main><script>
'use strict';
const names=`Bulbasaur,Ivysaur,Venusaur,Charmander,Charmeleon,Charizard,Squirtle,Wartortle,Blastoise,Caterpie,Metapod,Butterfree,Weedle,Kakuna,Beedrill,Pidgey,Pidgeotto,Pidgeot,Rattata,Raticate,Spearow,Fearow,Ekans,Arbok,Pikachu,Raichu,Sandshrew,Sandslash,Nidoran F,Nidorina,Nidoqueen,Nidoran M,Nidorino,Nidoking,Clefairy,Clefable,Vulpix,Ninetales,Jigglypuff,Wigglytuff,Zubat,Golbat,Oddish,Gloom,Vileplume,Paras,Parasect,Venonat,Venomoth,Diglett,Dugtrio,Meowth,Persian,Psyduck,Golduck,Mankey,Primeape,Growlithe,Arcanine,Poliwag,Poliwhirl,Poliwrath,Abra,Kadabra,Alakazam,Machop,Machoke,Machamp,Bellsprout,Weepinbell,Victreebel,Tentacool,Tentacruel,Geodude,Graveler,Golem,Ponyta,Rapidash,Slowpoke,Slowbro,Magnemite,Magneton,Farfetch'd,Doduo,Dodrio,Seel,Dewgong,Grimer,Muk,Shellder,Cloyster,Gastly,Haunter,Gengar,Onix,Drowzee,Hypno,Krabby,Kingler,Voltorb,Electrode,Exeggcute,Exeggutor,Cubone,Marowak,Hitmonlee,Hitmonchan,Lickitung,Koffing,Weezing,Rhyhorn,Rhydon,Chansey,Tangela,Kangaskhan,Horsea,Seadra,Goldeen,Seaking,Staryu,Starmie,Mr. Mime,Scyther,Jynx,Electabuzz,Magmar,Pinsir,Tauros,Magikarp,Gyarados,Lapras,Ditto,Eevee,Vaporeon,Jolteon,Flareon,Porygon,Omanyte,Omastar,Kabuto,Kabutops,Aerodactyl,Snorlax,Articuno,Zapdos,Moltres,Dratini,Dragonair,Dragonite,Mewtwo,Mew`.split(',');
const types=`Grass,Grass,Grass,Fire,Fire,Fire,Water,Water,Water,Bug,Bug,Bug,Bug,Bug,Bug,Normal,Normal,Normal,Normal,Normal,Normal,Normal,Poison,Poison,Electric,Electric,Ground,Ground,Poison,Poison,Poison,Poison,Poison,Poison,Normal,Normal,Fire,Fire,Normal,Normal,Poison,Poison,Grass,Grass,Grass,Bug,Bug,Bug,Bug,Ground,Ground,Normal,Normal,Water,Water,Fighting,Fighting,Fire,Fire,Water,Water,Water,Psychic,Psychic,Psychic,Fighting,Fighting,Fighting,Grass,Grass,Grass,Water,Water,Rock,Rock,Rock,Fire,Fire,Water,Water,Electric,Electric,Normal,Normal,Normal,Water,Water,Poison,Poison,Water,Water,Ghost,Ghost,Ghost,Rock,Psychic,Psychic,Water,Water,Electric,Electric,Grass,Grass,Ground,Ground,Fighting,Fighting,Normal,Poison,Poison,Ground,Ground,Normal,Grass,Normal,Water,Water,Water,Water,Water,Water,Psychic,Bug,Ice,Electric,Fire,Bug,Normal,Water,Water,Water,Normal,Normal,Water,Electric,Fire,Normal,Rock,Rock,Rock,Rock,Rock,Normal,Ice,Electric,Fire,Dragon,Dragon,Dragon,Psychic,Psychic`.split(',');
const spriteUrl=(id,back=false)=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-iii/firered-leafgreen/${back?'back/':''}${id+1}.png`;
const fallbackUrl=(id,back=false)=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${back?'back/':''}${id+1}.png`;
function spriteImage(id,back=false){let img=document.createElement('img');img.src=spriteUrl(id,back);img.alt=names[id];img.loading='lazy';img.onerror=()=>{if(!img.dataset.fallback){img.dataset.fallback='1';img.src=fallbackUrl(id,back)}else{img.replaceWith(Object.assign(document.createElement('span'),{textContent:'Pokémon #'+(id+1),className:'sprite-fallback'}))}};return img}
const emoji={Grass:'🌿',Fire:'🔥',Water:'💧',Bug:'🐛',Normal:'🐾',Poison:'☠️',Electric:'⚡',Ground:'🪨',Psychic:'🔮',Fighting:'🥊',Rock:'⛰️',Ghost:'👻',Ice:'❄️',Dragon:'🐉'};
const pools={Normal:[['Investida',40,100],['Ataque Rápido',45,100],['Golpe Corporal',65,90]],Fire:[['Brasa',45,100],['Presa de Fogo',60,95],['Lança-Chamas',85,90]],Water:[['Jato de Água',45,100],['Raio de Bolhas',60,95],['Hidro Bomba',90,80]],Grass:[['Chicote de Vinha',45,100],['Folha Navalha',65,95],['Raio Solar',90,80]],Electric:[['Choque do Trovão',45,100],['Faísca',65,95],['Raio',85,90]],Psychic:[['Confusão',45,100],['Psybeam',65,95],['Psíquico',85,90]],Fighting:[['Golpe de Karatê',45,100],['Chute Baixo',60,95],['Combate Próximo',85,85]],Poison:[['Agulha Venenosa',45,100],['Lodo',65,95],['Bomba de Lodo',85,90]],Ground:[['Tapa de Lama',45,100],['Escavar',65,95],['Terremoto',85,90]],Rock:[['Lançamento de Rocha',45,100],['Deslizamento',65,90],['Gume de Pedra',85,80]],Bug:[['Picada',45,100],['Corte Fúria',60,95],['Tesoura X',85,90]],Ghost:[['Lambida',45,100],['Soco Sombrio',65,95],['Bola Sombria',85,90]],Ice:[['Estilhaço de Gelo',45,100],['Vento Gelado',65,95],['Raio de Gelo',85,90]],Dragon:[['Sopro do Dragão',45,100],['Garra do Dragão',65,95],['Pulso do Dragão',85,90]]};
const strong={Fire:['Grass','Bug','Ice'],Water:['Fire','Rock','Ground'],Grass:['Water','Rock','Ground'],Electric:['Water'],Ground:['Fire','Electric','Poison','Rock'],Rock:['Fire','Ice','Bug'],Ice:['Grass','Ground','Dragon'],Fighting:['Normal','Rock','Ice'],Psychic:['Fighting','Poison'],Bug:['Grass','Psychic'],Ghost:['Ghost','Psychic'],Poison:['Grass'],Dragon:['Dragon']};
const resist={Fire:['Fire','Water','Rock','Dragon'],Water:['Water','Grass','Dragon'],Grass:['Fire','Grass','Poison','Bug','Dragon'],Electric:['Electric','Grass','Dragon'],Ground:['Grass','Bug'],Rock:['Fighting','Ground'],Ice:['Fire','Water','Ice'],Fighting:['Poison','Bug','Psychic'],Psychic:['Psychic'],Bug:['Fire','Fighting','Poison'],Ghost:['Normal'],Poison:['Poison','Ground','Rock','Ghost']};
const immune={Electric:['Ground'],Normal:['Ghost'],Fighting:['Ghost'],Ghost:['Normal']};
const specials={Bulbasaur:[115,54,55,45],Venusaur:[155,83,84,80],Charmander:[105,60,43,65],Charizard:[150,88,78,100],Squirtle:[120,48,65,43],Blastoise:[160,83,100,78],Pikachu:[105,62,42,95],Raichu:[135,90,60,110],Gengar:[130,90,65,110],Snorlax:[210,100,95,30],Dragonite:[180,115,95,85],Mewtwo:[185,125,90,130],Mew:[170,100,100,100],Magikarp:[90,20,40,80],Gyarados:[180,115,80,81],Chansey:[225,25,25,50]};
const $=id=>document.getElementById(id);let mode='ai',teamSize=5,draft=0,picks=[[],[]],players=[],current=0,round=1,finished=false;
function pokemon(id){let name=names[id],type=types[id],n=id+1;let [hp,attack,defense,speed]=specials[name]||[105+n*13%66,45+n*17%55,40+n*11%60,35+n*19%80];let moves=[{name:'Investida',type:'Normal',power:40,accuracy:100},...pools[type].map(([name,power,accuracy])=>({name,type,power,accuracy}))];moves=moves.filter((m,i,a)=>a.findIndex(x=>x.name===m.name)===i).slice(0,4);return {id,name,type,maxHp:hp,hp,attack,defense,speed,moves};}
function addButton(parent,label,handler,disabled=false,cls=''){let b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.className=cls;b.onclick=handler;parent.appendChild(b);return b;}
function draftRender(){mode=$('mode').value;teamSize=+$('size').value;let isAI=mode==='ai',label=draft===0?'Jogador 1':'Jogador 2';$('draft-info').textContent=`${label}: escolha ${teamSize} Pokémon (${picks[draft].length}/${teamSize})`;let chosen=$('chosen');chosen.replaceChildren();picks[draft].forEach(id=>{let b=addButton(chosen,`${names[id]} ✕`,()=>{picks[draft]=picks[draft].filter(x=>x!==id);draftRender()});b.title='Remover da equipe'});$('next').disabled=picks[draft].length!==teamSize;$('next').textContent=(draft===0&&!isAI)?'Escolher equipe do Jogador 2':'Começar batalha';let dex=$('dex');dex.replaceChildren();let term=$('search').value.toLowerCase();names.forEach((name,id)=>{if(!(name.toLowerCase().includes(term)||String(id+1).includes(term)))return;(()=>{let b=addButton(dex,`#${String(id+1).padStart(3,'0')} ${name}`,()=>{if(picks[draft].length<teamSize&&!picks[draft].includes(id)){picks[draft].push(id);draftRender()}},picks[draft].includes(id)||picks[draft].length>=teamSize,picks[draft].includes(id)?'selected':'');b.prepend(spriteImage(id))})()})}
$('mode').onchange=()=>{draft=0;picks=[[],[]];draftRender()};$('size').onchange=()=>{draft=0;picks=[[],[]];draftRender()};$('search').oninput=draftRender;$('clear-team').onclick=()=>{picks[draft]=[];draftRender()};$('random-team').onclick=()=>{let all=Array.from({length:151},(_,i)=>i).filter(i=>!picks[draft].includes(i));while(picks[draft].length<teamSize){let i=Math.floor(Math.random()*all.length);picks[draft].push(all.splice(i,1)[0])}draftRender()};
$('next').onclick=()=>{if(picks[draft].length!==teamSize)return;if(mode==='pvp'&&draft===0){draft=1;$('search').value='';draftRender();return}if(mode==='ai'){let all=Array.from({length:151},(_,i)=>i);picks[1]=[];while(picks[1].length<teamSize){let i=Math.floor(Math.random()*all.length);picks[1].push(all.splice(i,1)[0])}}players=picks.map((ids,i)=>({name:i===0?'Jogador 1':mode==='ai'?'Computador':'Jogador 2',team:ids.map(pokemon),active:0,bag:{Potion:3,'Super Potion':2,Revive:1}}));$('setup').classList.add('hidden');$('game').classList.remove('hidden');log('A batalha começou!');render();turnMenu()};
function active(i){return players[i].team[players[i].active]}function alive(p){return p.team.some(x=>x.hp>0)}function log(msg){let p=document.createElement('p');p.textContent=msg;$('log').prepend(p)}
function render(){players.forEach((p,i)=>{let n=i+1,x=active(i),pct=100*x.hp/x.maxHp;$('name'+n).textContent=`${p.name}: ${x.name}`;$('type'+n).textContent=x.type;let holder=$('sprite'+n);if(holder.dataset.id!==String(x.id)){holder.replaceChildren(spriteImage(x.id,i===0));holder.dataset.id=String(x.id)}$('bar'+n).style.width=pct+'%';$('bar'+n).style.background=pct>50?'#43c879':pct>25?'#efbb48':'#e84c60';$('hp'+n).textContent=`HP ${x.hp}/${x.maxHp}`;$('state'+n).textContent=x.hp?'Em batalha':'DERROTADO';$('team'+n).textContent=p.team.map((q,j)=>`${j===p.active?'▶ ':''}${q.name}${q.hp===0?' ✖':''}`).join(' • ')})}
function setMenu(title,buttons){$('turn-title').textContent=title;$('actions').replaceChildren();$('subactions').replaceChildren();buttons.forEach(([label,fn,disabled])=>addButton($('actions'),label,fn,disabled))}
function turnMenu(){if(finished)return;render();let p=players[current],x=active(current);$('message').textContent=`Rodada ${round}`;if(x.hp===0){switchMenu(true);return}if(mode==='ai'&&current===1){setMenu('Vez do Computador...',[]);setTimeout(aiTurn,500);return}setMenu(`Vez de ${p.name}: ${x.name}`,[['⚔️ Atacar',attackMenu],['🎒 Itens',itemMenu],['🔄 Trocar Pokémon',()=>switchMenu(false)]])}
function attackMenu(){let x=active(current);setMenu(`Ataques de ${x.name}`,x.moves.map(m=>[`${m.name} (${m.power} poder, ${m.accuracy}% precisão)`,()=>doAttack(m)]).concat([['← Voltar',turnMenu]]))}
function itemMenu(){let p=players[current];let opts=[['Potion',40,false],['Super Potion',80,false],['Revive',0,true]];setMenu('Escolha um item',opts.map(([name,amount,revive])=>[`${name} (${p.bag[name]})`,()=>targetMenu(name,amount,revive),p.bag[name]===0]).concat([['← Voltar',turnMenu]]))}
function targetMenu(name,amount,revive){let p=players[current];let valid=p.team.map((x,i)=>({x,i})).filter(({x})=>revive?x.hp===0:x.hp>0&&x.hp<x.maxHp);setMenu(`Usar ${name} em:`,valid.map(({x,i})=>[`${x.name} (${x.hp}/${x.maxHp} HP)`,()=>{if(revive)x.hp=Math.max(1,Math.floor(x.maxHp/2));else x.hp=Math.min(x.maxHp,x.hp+amount);p.bag[name]--;log(`${p.name} usou ${name} em ${x.name}!`);endAction()}]).concat([['← Voltar',itemMenu]]))}
function switchMenu(forced){let p=players[current],options=p.team.map((x,i)=>({x,i})).filter(({x,i})=>x.hp>0&&i!==p.active);setMenu(forced?`${p.name}: escolha outro Pokémon!`:'Trocar Pokémon',options.map(({x,i})=>[`${x.name} (${x.hp}/${x.maxHp} HP)`,()=>{p.active=i;log(`${p.name} enviou ${x.name}!`);if(forced){render();turnMenu()}else endAction()}]).concat(forced?[]:[['← Voltar',turnMenu]]))}
function multiplier(a,b){if((immune[a]||[]).includes(b))return 0;if((strong[a]||[]).includes(b))return 2;if((resist[a]||[]).includes(b))return .5;return 1}
function doAttack(move){let a=active(current),b=active(1-current);log(`${a.name} usou ${move.name}!`);if(Math.random()*100>=move.accuracy){log('O ataque errou!')}else{let m=multiplier(move.type,b.type);let critical=Math.random()<.1;let damage=m===0?0:Math.max(1,Math.floor((move.power*a.attack/Math.max(1,b.defense)*.34+3)*m*(move.type===a.type?1.2:1)*(critical?1.5:1)*(.85+Math.random()*.15)));b.hp=Math.max(0,b.hp-damage);log(`${b.name} sofreu ${damage} de dano.${m===2?' Super efetivo!':m===.5?' Pouco efetivo.':m===0?' Sem efeito!':''}${critical?' Acerto crítico!':''}`);if(b.hp===0)log(`${b.name} foi DERROTADO!`)}endAction()}
function endAction(){render();if(!alive(players[1-current])){endGame();return}if(active(1-current).hp===0){current=1-current;switchMenu(true);return}current=1-current;if(current===0)round++;turnMenu()}
function aiTurn(){if(finished||current!==1)return;let p=players[1],x=active(1);if(x.hp<x.maxHp*.28&&p.bag['Super Potion']>0&&Math.random()<.55){p.bag['Super Potion']--;x.hp=Math.min(x.maxHp,x.hp+80);log('Computador usou Super Potion!');endAction();return}let foe=active(0);let best=[...x.moves].sort((a,b)=>b.power*multiplier(b.type,foe.type)*b.accuracy-a.power*multiplier(a.type,foe.type)*a.accuracy);doAttack(Math.random()<.75?best[0]:x.moves[Math.floor(Math.random()*x.moves.length)])}
function endGame(){finished=true;let winner=players.find(alive);$('game').classList.add('hidden');$('finish').classList.remove('hidden');$('winner').textContent=`🏆 Vitória de ${winner.name}!`;$('result').textContent=`A batalha terminou na rodada ${round}. Parabéns!`}
if(names.length!==151||types.length!==151)alert('Erro na lista de Pokémon.');draftRender();
</script></body></html>
