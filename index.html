function tierOf(id){let n=names[id];if(n==='Mewtwo'||n==='Mew')return 5;if(legends.has(n))return 4;if(finals.has(n))return 3;if(mids.has(n)||strongBasics.has(n))return 2;return 1}

function trainerBox(el,t){el.replaceChildren();let n=document.createElement('strong');n.textContent=t.name;el.append(trainerImg(t,230),n)}
function trainerPickRender(){let b=$('trainer-pick');b.replaceChildren();TRAINERS.forEach(t=>{let btn=document.createElement('button');btn.className=t.id===myTrainer.id?'selected':'';btn.title=t.name;btn.append(trainerImg(t,56),Object.assign(document.createElement('span'),{textContent:t.name}));btn.onclick=()=>{myTrainer=t;prog.trainer=t.id;saveProg();trainerPickRender()};b.appendChild(btn)})}
function tourBoxRender(){let b=$('tour-box');b.replaceChildren();if(mode!=='tournament')return;if(!tourOpen(selTour))selTour=0;let h=document.createElement('p');h.className='muted tiny';h.textContent='Escolha o torneio (oitavas → final). Vença para ganhar a insígnia e liberar o próximo. Sua equipe será usada em todas as partidas, com HP restaurado entre elas.';b.appendChild(h);let row=document.createElement('div');row.className='grid';TOURS.forEach((T,i)=>{let open=tourOpen(i),won=prog.won.includes(T.id);addButton(row,`${open?T.icon:'🔒'} ${T.name} (${T.region})${won?' ✅ '+T.badge:''}`,()=>{selTour=i;draftRender()},!open,i===selTour?'selected':'')});b.appendChild(row)}
function aiPick(count,strength=0){let pool=allIds().filter(i=>isUnlocked(i)).map(i=>{let q=pokemon(i);return{i,p:q.maxHp/2+q.attack+q.defense+q.speed}}).sort((a,b)=>b.p-a.p);pool=pool.slice(0,Math.max(count,Math.ceil(pool.length*(1-.6*strength))));let out=[];while(out.length<count&&pool.length)out.push(pool.splice(Math.random()*pool.length|0,1)[0].i);return out}
function beginBattle(opp,oppIds){picks[1]=oppIds;players=[picks[0],picks[1]].map((ids,i)=>({name:i===0?(mode==='pvp'?'Jogador 1':myTrainer.name):(mode==='pvp'?'Jogador 2':opp.name),team:ids.map(pokemon),active:0,bag:{Potion:3,'Super Potion':2,Revive:1}}));finished=false;current=0;round=1;$('log').replaceChildren();$('sprite1').dataset.id='';$('sprite2').dataset.id='';['setup','bracket','finish'].forEach(x=>$(x).classList.add('hidden'));$('game').classList.remove('hidden');trainerBox($('tr1'),myTrainer);trainerBox($('tr2'),opp);log(mode==='tournament'?`${ROUND_NAMES[tour.round]}: ${myTrainer.name} vs ${opp.name}!`:'A batalha começou!');render();turnMenu()}
function startTournament(ti){let others=shuffle(TRAINERS.filter(t=>t.id!==myTrainer.id)).slice(0,15);tour={ti,round:0,alive:[myTrainer,...others],history:[],done:null};showBracket()}
function showBracket(){['setup','game','finish'].forEach(x=>$(x).classList.add('hidden'));$('bracket').classList.remove('hidden');let T=TOURS[tour.ti],b=$('br-body'),go=$('br-go');$('br-title').textContent=`${T.icon} ${T.name} — ${T.region}`;b.replaceChildren();
tour.history.forEach((r,ri)=>{let d=document.createElement('div'),h=document.createElement('h3');h.textContent=ROUND_NAMES[ri];d.appendChild(h);r.forEach(m=>{let q=document.createElement('p');q.className='muted';q.textContent=`${m.w===m.a?'🏆 ':''}${m.a.name}  ×  ${m.w===m.b?'🏆 ':''}${m.b.name}${m.you?'  ← sua partida':''}`;d.appendChild(q)});b.appendChild(d)});
let msg=document.createElement('h3');
if(tour.done==='champion'){let nx=TOURS[tour.ti+1];msg.textContent=`🎉 Campeão! Você conquistou a ${T.badge} ${T.icon} (+100 XP)`+(nx?` Torneio liberado: ${nx.name}.`:' Você completou todos os torneios!')}
else if(tour.done==='eliminated'){msg.textContent=`💔 Você foi eliminado nas ${ROUND_NAMES[tour.history.length-1]}. Tente novamente!`}
else{msg.textContent=`Próxima partida — ${ROUND_NAMES[tour.round]}: ${tour.alive[0].name} vs ${tour.alive[1].name}`}
b.appendChild(msg);
if(tour.done){go.textContent='Voltar ao menu';go.onclick=()=>location.reload()}else{go.textContent='⚔️ Lutar!';go.onclick=()=>{let strength=Math.min(1,tour.ti/(TOURS.length-1)*.5+tour.round/3*.5);beginBattle(tour.alive[1],aiPick(teamSize,strength))}}}
function tourAdvance(won){let al=tour.alive,r=[{a:al[0],b:al[1],w:won?al[0]:al[1],you:true}],next=[al[0]];for(let i=2;i<al.length;i+=2){let w=Math.random()<.5?al[i]:al[i+1];r.push({a:al[i],b:al[i+1],w});next.push(w)}tour.history.push(r);
if(!won)tour.done='eliminated';else if(tour.round===3){tour.done='champion';let id=TOURS[tour.ti].id;if(!prog.won.includes(id))prog.won.push(id);saveProg();addXp(100);trainerRender()}else{tour.alive=next;tour.round++}showBracket()}
/* ===== SONS (Web Audio, sem arquivos externos) ===== */
let actx=null,muted=false;
function ac(){if(muted)return null;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx}catch(e){return null}}
function tone(f,d,w='square',v=.1,t=0,f2=f){let c=ac();if(!c)return;let o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t;o.type=w;o.frequency.setValueAtTime(f,s);o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(c.destination);o.start(s);o.stop(s+d)}
function noise(d,v=.15,t=0,freq=1000,kind='lowpass'){let c=ac();if(!c)return;let n=c.sampleRate*d|0,buf=c.createBuffer(1,n,c.sampleRate),data=buf.getChannelData(0);for(let i=0;i<n;i++)data[i]=Math.random()*2-1;let src=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain(),s=c.currentTime+t;src.buffer=buf;fl.type=kind;fl.frequency.value=freq;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);src.connect(fl).connect(g).connect(c.destination);src.start(s)}
const moveSounds={
Normal:()=>{noise(.12,.2,0,1800);tone(160,.15,'triangle',.2,0,50)},
Fighting:()=>{noise(.1,.25,0,2500);tone(120,.2,'triangle',.25,0,40);tone(200,.08,'square',.08,.1,80)},
Fire:()=>{noise(.6,.2,0,1400);tone(400,.5,'sawtooth',.06,0,90)},
Water:()=>{[0,.1,.2,.3].forEach((t,i)=>tone(350+i*120,.12,'sine',.15,t,700+i*150));noise(.4,.08,0,3000,'highpass')},
Grass:()=>{noise(.15,.15,0,3500,'bandpass');noise(.15,.15,.12,2500,'bandpass');tone(500,.2,'triangle',.05,0,900)},
Electric:()=>{for(let i=0;i<8;i++)tone(i%2?1400:700,.05,'square',.08,i*.05);noise(.4,.1,0,5000,'highpass')},
Psychic:()=>{tone(500,.5,'sine',.15,0,1300);tone(520,.5,'sine',.1,.05,300)},
Poison:()=>{tone(200,.4,'sawtooth',.08,0,120);tone(210,.4,'sawtooth',.07,.02,90);noise(.3,.1,0,800)},
Ground:()=>{noise(.5,.3,0,300);tone(70,.5,'sine',.35,0,30)},
Rock:()=>{noise(.25,.3,0,600);tone(90,.3,'triangle',.3,0,35);noise(.2,.2,.2,900)},
Bug:()=>{for(let i=0;i<6;i++)tone(900+(i%3)*200,.04,'square',.06,i*.04)},
Ghost:()=>{tone(350,.7,'sine',.15,0,120);tone(355,.7,'triangle',.1,.05,110)},
Ice:()=>{[1500,2000,2600,3200].forEach((f,i)=>tone(f,.25,'sine',.08,i*.06,f*.8));noise(.2,.08,0,6000,'highpass')},
Dragon:()=>{tone(220,.6,'sawtooth',.14,0,70);noise(.5,.2,.05,700)}};
const moveSfx=t=>(moveSounds[t]||moveSounds.Normal)();
const missSfx=()=>noise(.25,.12,.2,4000,'highpass');
function impactSfx(m){if(m===0){tone(200,.2,'sine',.1,.25,150);return}if(m===2){noise(.3,.35,.25,2500);tone(110,.3,'square',.2,.25,40);tone(900,.1,'square',.1,.25,300)}else if(m===.5){noise(.12,.1,.25,800);tone(100,.15,'triangle',.1,.25,60)}else{noise(.18,.25,.25,1800);tone(130,.2,'square',.15,.25,50)}}
const faintSfx=()=>tone(500,.7,'square',.12,.5,60);
const winSfx=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'square',.1,i*.15));
const loseSfx=()=>[400,330,260,200].forEach((f,i)=>tone(f,.3,'triangle',.12,i*.2));
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇 Som desligado':'🔊 Som ligado'};
function pokemon(id){let name=names[id],type=types[id],n=id+1;let [hp,attack,defense,speed]=specials[name]||[105+n*13%66,45+n*17%55,40+n*11%60,35+n*19%80];let moves=[{name:'Investida',type:'Normal',power:40,accuracy:100},...pools[type].map(([name,power,accuracy])=>({name,type,power,accuracy}))];moves=moves.filter((m,i,a)=>a.findIndex(x=>x.name===m.name)===i).slice(0,4);return {id,name,type,maxHp:hp,hp,attack,defense,speed,moves};}
function addButton(parent,label,handler,disabled=false,cls=''){let b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.className=cls;b.onclick=handler;parent.appendChild(b);return b;}
function draftRender(){mode=$('mode').value;teamSize=+$('size').value;tourBoxRender();let isAI=mode!=='pvp',label=draft===0?'Jogador 1':'Jogador 2';$('draft-info').textContent=`${label}: escolha ${teamSize} Pokémon (${picks[draft].length}/${teamSize})`+(mode==='pvp'?' — os dois jogadores usam os Pokémon liberados pelo nível do Treinador.':'');let chosen=$('chosen');chosen.replaceChildren();picks[draft].forEach(id=>{let b=addButton(chosen,`${names[id]} ✕`,()=>{picks[draft]=picks[draft].filter(x=>x!==id);draftRender()});b.title='Remover da equipe'});$('next').disabled=picks[draft].length!==teamSize;$('next').textContent=mode==='tournament'?'Começar torneio':(draft===0&&!isAI)?'Escolher equipe do Jogador 2':'Começar batalha';let dex=$('dex');dex.replaceChildren();let term=$('search').value.toLowerCase();names.forEach((name,id)=>{if(!(name.toLowerCase().includes(term)||String(id+1).includes(term)))return;(()=>{let open=isUnlocked(id),sel=picks[draft].includes(id);let b=addButton(dex,`${open?'':'🔒 Nv '+reqLevel(id)+' '}#${String(id+1).padStart(3,'0')} ${name}`,()=>{if(open&&picks[draft].length<teamSize&&!picks[draft].includes(id)){picks[draft].push(id);draftRender()}},sel||picks[draft].length>=teamSize||!open,sel?'selected':open?'':'locked');if(!open)b.title=`Bloqueado: requer Treinador Nv ${reqLevel(id)}`;b.prepend(spriteImage(id))})()})}
$('mode').onchange=()=>{draft=0;picks=[[],[]];draftRender()};$('size').onchange=()=>{draft=0;picks=[[],[]];draftRender()};$('search').oninput=draftRender;$('clear-team').onclick=()=>{picks[draft]=[];draftRender()};$('random-team').onclick=()=>{let all=allIds().filter(i=>isUnlocked(i)&&!picks[draft].includes(i));while(picks[draft].length<teamSize&&all.length){let i=Math.floor(Math.random()*all.length);picks[draft].push(all.splice(i,1)[0])}draftRender()};
$('next').onclick=()=>{if(picks[draft].length!==teamSize)return;if(mode==='pvp'&&draft===0){draft=1;$('search').value='';draftRender();return}if(mode==='tournament'){startTournament(selTour);return}let opp=shuffle(TRAINERS.filter(t=>t.id!==myTrainer.id))[0];beginBattle(opp,mode==='ai'?aiPick(teamSize):picks[1])};
function active(i){return players[i].team[players[i].active]}function alive(p){return p.team.some(x=>x.hp>0)}function log(msg){let p=document.createElement('p');p.textContent=msg;$('log').prepend(p)}
function render(){players.forEach((p,i)=>{let n=i+1,x=active(i),pct=100*x.hp/x.maxHp;$('name'+n).textContent=`${p.name}: ${x.name}`;$('type'+n).textContent=x.type;let holder=$('sprite'+n);if(holder.dataset.id!==String(x.id)){holder.replaceChildren(spriteImage(x.id,i===0,true));holder.dataset.id=String(x.id)}$('bar'+n).style.width=pct+'%';$('bar'+n).style.background=n===2?(pct>25?'#e8434f':'#a8212f'):pct>50?'#43c879':pct>25?'#efbb48':'#ff8a3d';$('hpt'+n).textContent=`${x.hp} / ${x.maxHp}`;$('hp'+n).textContent=`HP ${x.hp}/${x.maxHp} (${Math.round(pct)}%)`;$('state'+n).textContent=x.hp?'Em batalha':'DERROTADO';$('team'+n).textContent=p.team.map((q,j)=>`${j===p.active?'▶ ':''}${q.name}${q.hp===0?' ✖':''}`).join(' • ')})}
function setMenu(title,buttons){$('turn-title').textContent=title;$('actions').replaceChildren();$('subactions').replaceChildren();buttons.forEach(([label,fn,disabled])=>addButton($('actions'),label,fn,disabled))}
function turnMenu(){if(finished)return;render();let p=players[current],x=active(current);$('message').textContent=`Rodada ${round}`;if(x.hp===0){switchMenu(true);return}if(mode!=='pvp'&&current===1){setMenu(`Vez de ${players[1].name}...`,[]);setTimeout(aiTurn,500);return}setMenu(`Vez de ${p.name}: ${x.name}`,[['⚔️ Atacar',attackMenu],['🎒 Itens',itemMenu],['🔄 Trocar Pokémon',()=>switchMenu(false)]])}
function attackMenu(){let x=active(current);setMenu(`Ataques de ${x.name}`,x.moves.map(m=>[`${emoji[m.type]} ${m.name} (${m.power} poder, ${m.accuracy}% precisão)`,()=>doAttack(m)]).concat([['← Voltar',turnMenu]]))}
function itemMenu(){let p=players[current];let opts=[['Potion',40,false],['Super Potion',80,false],['Revive',0,true]];setMenu('Escolha um item',opts.map(([name,amount,revive])=>[`${name} (${p.bag[name]})`,()=>targetMenu(name,amount,revive),p.bag[name]===0]).concat([['← Voltar',turnMenu]]))}
function targetMenu(name,amount,revive){let p=players[current];let valid=p.team.map((x,i)=>({x,i})).filter(({x})=>revive?x.hp===0:x.hp>0&&x.hp<x.maxHp);setMenu(`Usar ${name} em:`,valid.map(({x,i})=>[`${x.name} (${x.hp}/${x.maxHp} HP)`,()=>{if(revive)x.hp=Math.max(1,Math.floor(x.maxHp/2));else x.hp=Math.min(x.maxHp,x.hp+amount);p.bag[name]--;log(`${p.name} usou ${name} em ${x.name}!`);endAction()}]).concat([['← Voltar',itemMenu]]))}
function switchMenu(forced){let p=players[current],options=p.team.map((x,i)=>({x,i})).filter(({x,i})=>x.hp>0&&i!==p.active);setMenu(forced?`${p.name}: escolha outro Pokémon!`:'Trocar Pokémon',options.map(({x,i})=>[`${x.name} (${x.hp}/${x.maxHp} HP)`,()=>{p.active=i;log(`${p.name} enviou ${x.name}!`);if(forced){render();turnMenu()}else endAction()}]).concat(forced?[]:[['← Voltar',turnMenu]]))}
function multiplier(a,b){if((immune[a]||[]).includes(b))return 0;if((strong[a]||[]).includes(b))return 2;if((resist[a]||[]).includes(b))return .5;return 1}
function doAttack(move){let a=active(current),b=active(1-current);log(`${a.name} usou ${move.name}!`);moveSfx(move.type);if(Math.random()*100>=move.accuracy){log('O ataque errou!');missSfx()}else{let m=multiplier(move.type,b.type);let critical=Math.random()<.1;let damage=m===0?0:Math.max(1,Math.floor((move.power*a.attack/Math.max(1,b.defense)*.34+3)*m*(move.type===a.type?1.2:1)*(critical?1.5:1)*(.85+Math.random()*.15)));b.hp=Math.max(0,b.hp-damage);impactSfx(m);log(`${b.name} sofreu ${damage} de dano.${m===2?' Super efetivo!':m===.5?' Pouco efetivo.':m===0?' Sem efeito!':''}${critical?' Acerto crítico!':''}`);if(b.hp===0){log(`${b.name} foi DERROTADO!`);faintSfx()}let h=$('sprite'+(2-current));h.classList.add('hit');setTimeout(()=>h.classList.remove('hit'),450)}endAction()}
function endAction(){render();if(!alive(players[1-current])){endGame();return}if(active(1-current).hp===0){current=1-current;switchMenu(true);return}current=1-current;if(current===0)round++;turnMenu()}
function aiTurn(){if(finished||current!==1)return;let p=players[1],x=active(1);if(x.hp<x.maxHp*.28&&p.bag['Super Potion']>0&&Math.random()<.55){p.bag['Super Potion']--;x.hp=Math.min(x.maxHp,x.hp+80);log(`${p.name} usou Super Potion!`);endAction();return}let foe=active(0);let best=[...x.moves].sort((a,b)=>b.power*multiplier(b.type,foe.type)*b.accuracy-a.power*multiplier(a.type,foe.type)*a.accuracy);doAttack(Math.random()<.75?best[0]:x.moves[Math.floor(Math.random()*x.moves.length)])}
function endGame(){finished=true;let winner=players.find(alive),won=winner===players[0];(won?winSfx:loseSfx)();$('game').classList.add('hidden');$('finish').classList.remove('hidden');$('winner').textContent=`🏆 Vitória de ${winner.name}!`;$('result').textContent=`A batalha terminou na rodada ${round}. Parabéns!`;
let kos=players[1].team.filter(x=>x.hp===0).length,gain=kos*20+(won?50:0),before=trainer.level;addXp(gain);let unlockedNow=allIds().filter(i=>isUnlocked(i)&&!isUnlocked(i,before));
let msg=`Treinador (Jogador 1) ganhou +${gain} XP (${kos} Pokémon derrotados${won?' + bônus de vitória':''}).`;if(trainer.level>before)msg+=` ⬆️ Subiu para o Nv ${trainer.level}!`;if(unlockedNow.length)msg+=` 🔓 Novos Pokémon liberados: ${unlockedNow.map(i=>names[i]).join(', ')}.`;$('xp-result').textContent=msg;let fb=$('finish-btn');if(mode==='tournament'){fb.textContent='Continuar torneio';fb.onclick=()=>tourAdvance(won)}else{fb.textContent='Jogar novamente';fb.onclick=()=>location.reload()}}
/* ===== MÚSICA DE FUNDO (arquivo local: music/last-friday-night.mp3) ===== */
const bgm=$('bgm');bgm.volume=.4;let musicOn=true;
function musicLabel(){$('music-btn').textContent=bgm.error?'🎵 Sem arquivo de música':(musicOn&&!bgm.paused)?'🎵 Música ligada':'🔇 Música desligada'}
function playMusic(){if(!musicOn||bgm.error)return musicLabel();let r=bgm.play();if(r&&r.then)r.then(musicLabel).catch(musicLabel)}
document.addEventListener('click',playMusic);
$('music-btn').onclick=e=>{e.stopPropagation();musicOn=!musicOn;if(musicOn)playMusic();else{bgm.pause();musicLabel()}};
$('music-vol').oninput=()=>{bgm.volume=+$('music-vol').value};
bgm.addEventListener('error',musicLabel);musicLabel();
if(names.length!==151||types.length!==151)alert('Erro na lista de Pokémon.');trainerRender();trainerPickRender();draftRender();
</script></body></html>
